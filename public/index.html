<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catbox Uploader - Hébergeur de fichiers rapide et gratuit</title>
  <meta name="description" content="Uploadez facilement vos fichiers et obtenez instantanément un lien Catbox partageable. Un service rapide, simple et gratuit.">
  <meta property="og:title" content="Catbox Uploader">
  <meta property="og:description" content="Uploadez facilement vos fichiers et obtenez instantanément un lien Catbox.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
  <link rel="stylesheet" href="sida.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📦 Catbox Uploader</h1>
      <p class="subtitle">Partagez vos fichiers en un clic</p>
    </header>

    <main>
      <!-- Zone de sélection / Drag & Drop -->
      <div id="drop-zone" class="drop-zone">
        <input type="file" id="file-input" class="file-input" />
        <div class="drop-zone-content" id="drop-zone-content">
          <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <p class="drop-text">Glissez-déposez un fichier ici</p>
          <p class="drop-subtext">ou</p>
          <button type="button" class="btn btn-secondary" id="browse-btn">Choisir un fichier</button>
          <p class="file-limits">Images, vidéos, audio, docs • Max 200 Mo</p>
        </div>
      </div>

      <!-- Prévisualisation du fichier sélectionné -->
      <div id="file-preview-card" class="card hidden">
        <div class="preview-header">
          <div id="media-preview" class="media-preview"></div>
          <div class="file-details">
            <span id="file-name" class="file-name">nom_du_fichier.ext</span>
            <span id="file-meta" class="file-meta">0 Mo • Type</span>
          </div>
        </div>
        
        <!-- Barre de progression -->
        <div id="progress-container" class="progress-container hidden">
          <div id="progress-bar" class="progress-bar"></div>
        </div>

        <button id="upload-btn" class="btn btn-primary btn-block">Uploader</button>
      </div>

      <!-- Message d'erreur -->
      <div id="error-message" class="alert alert-error hidden"></div>

      <!-- Zone de résultat (Lien généré) -->
      <div id="result-card" class="card result-card hidden">
        <div class="alert alert-success">✓ Fichier uploadé avec succès !</div>
        <label for="result-url" class="result-label">Votre lien public Catbox :</label>
        <div class="input-group">
          <input type="text" id="result-url" readonly />
          <button id="copy-btn" class="btn btn-primary">Copier le lien</button>
        </div>
        <button id="reset-btn" class="btn btn-outline btn-block margin-top">Uploader un autre fichier</button>
      </div>
    </main>

    <footer>
      <p>Propulsé par l'API Catbox.moe</p>
    </footer>
  </div>

  <script src="appo.js"></script>
</body>
</html>
